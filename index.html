<!DOCTYPE html>
<html>
<head>
    <title>Deepfake Detection</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
        }

        input, button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
        }

        button {
            background: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        img {
            margin-top: 15px;
            max-width: 100%;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Deepfake Detection</h1>

    <input type="file" id="imageInput">
    <button onclick="uploadImage()">Detect</button>

    <img id="preview">

    <div id="result"></div>
</div>

<script>
function uploadImage() {
    const fileInput = document.getElementById('imageInput');
    const file = fileInput.files[0];

    const formData = new FormData();
    formData.append("file", file);

    document.getElementById("preview").src = URL.createObjectURL(file);

    fetch("/predict", {
        method: "POST",
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("result").innerText =
            "Prediction: " + data.prediction + 
            " (" + data.confidence.toFixed(2) + "%)";
    });
}
</script>

</body>
</html>
